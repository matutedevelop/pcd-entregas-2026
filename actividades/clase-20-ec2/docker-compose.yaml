name: clase-16

services:
  ui:
    build: ./ui
    ports:
      - "8501:8501"
    env_file:
      - ./ui/.env
    network_mode: host
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_URL: http://host.docker.internal:8000/api/v1/predicciones

  api:
    image: nyc-taxi-api-image:v1
    container_name: nyc-taxi-api-container
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    network_mode: host
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
